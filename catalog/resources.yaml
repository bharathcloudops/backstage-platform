#==============================================================================
# OCI PRODUCTION ENVIRONMENT
#==============================================================================

apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: oci-production
  title: OCI Production Environment
  annotations:
    cloud.bharathcoudops.dev/provider: OCI
    cloud.bharathcoudops.dev/environment: Production
    cloud.bharathcoudops.dev/region: uk-london-1
spec:
