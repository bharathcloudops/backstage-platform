#==============================================================================
# YARN PACKAGE MANAGEMENT CONFIGURATION
#==============================================================================

#==============================================================================
# INSTALLATION SETTINGS
#==============================================================================

nodeLinker: node-modules
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'

#==============================================================================
# PINNED YARN RELEASE
#==============================================================================

yarnPath: .yarn/releases/yarn-4.13.0.cjs

#==============================================================================
# REVIEWED ADVISORY EXCEPTIONS
#==============================================================================

#==============================================================================
# 1123940 (GHSA-23hp-3jrh-7fpw) - tar 6.2.1 through node-gyp 10.3.1, used only while
# building native modules in the image build stage and never at runtime.
# Re-review when Backstage or node-gyp is upgraded.
#==============================================================================

npmAuditIgnoreAdvisories:
  - "1123940"
